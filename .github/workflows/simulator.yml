name: CIRNET Simulator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CIRNET_CONTRACTS_DEV_WHEEL_URL: https://api.github.com/repos/cirnetlab/cirnet-contracts/releases/assets/712718400
  CIRNET_CONTRACTS_DEV_WHEEL_SHA256: 61009f539e672cd6bdd799c608d30273f2e6988ad429147b2efa8e3873d51c08
  CIRNET_CONTRACTS_WHEEL_URL: https://api.github.com/repos/cirnetlab/cirnet-contracts/releases/assets/712718253
  CIRNET_CONTRACTS_WHEEL_SHA256: 7b092af5817b0e15f02f9f5f292a8e1b20fe1d512600f9c0260d05a58ddaaf42
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap the pinned independent allocator
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/bootstrap_contract_tools.py
      - name: Keep temporary build/install output in the owned session
        shell: bash
        run: |
          {
            echo "TMP=$CIRNET_ARTIFACTS_SESSION"
            echo "TEMP=$CIRNET_ARTIFACTS_SESSION"
            echo "TMPDIR=$CIRNET_ARTIFACTS_SESSION"
            echo "npm_config_cache=$CIRNET_ARTIFACTS_SESSION/npm-cache"
            echo "PIP_CACHE_DIR=$CIRNET_ARTIFACTS_SESSION/pip-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"
      - name: Install locked dependencies and selected Contracts 0.1.2
        env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-verification.lock
          python -B scripts/install_contracts.py
      - name: Build and verify the installed distribution
        run: |
          python -m build --no-isolation --outdir "$CIRNET_ARTIFACTS_SESSION/dist"
          python -m pip install --no-deps --force-reinstall "$CIRNET_ARTIFACTS_SESSION/dist/cirnet_simulator-0.1.2-py3-none-any.whl"
          python -m pip check
          python scripts/check_installed.py --wheel "$CIRNET_ARTIFACTS_SESSION/dist/cirnet_simulator-0.1.2-py3-none-any.whl"
          (cd "$CIRNET_ARTIFACTS_SESSION/dist" && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          cd "$CIRNET_ARTIFACTS_SESSION"
          python -I -B -m pytest "$GITHUB_WORKSPACE/tests" --basetemp "$CIRNET_ARTIFACTS_SESSION/pytest"
      - name: Upload versioned wheel and sdist for review
        uses: actions/upload-artifact@v4
        with:
          name: cirnet-simulator-v0.1.2
          path: ${{ env.CIRNET_ARTIFACTS_SESSION }}/dist/*
          if-no-files-found: error
      - name: Clean this owned verification session
        if: always() && env.CIRNET_ARTIFACTS_SESSION != ''
        run: node "$CIRNET_ARTIFACTS_CLI" --cleanup "$CIRNET_ARTIFACTS_SESSION"
