[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirnet-simulator"
version = "0.1.2"
description = "Deterministic digital and bounded DC simulation for CIRNET"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = ["cirnet-contracts==0.1.2", "jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/cirnetlab/cirnet-simulator"
Documentation = "https://github.com/cirnetlab/cirnet-simulator/blob/master/README.md"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["cirnet_sim*", "netcircuit_sim"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests"]
